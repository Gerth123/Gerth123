name: Update GitHub README stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Gerth123&show_icons=true&hide_rank=true&theme=dracula&hide_border=false
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=Gerth123&layout=compact&langs_count=5&theme=dracula&hide_border=false
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN }}

      # Verwirft Fehler-SVGs, damit sie die funktionierenden Karten nicht ueberschreiben
      - name: Verify cards
        run: |
          failed=0
          for f in profile/stats.svg profile/top-langs.svg; do
            if grep -Eq 'Something went wrong|Resource not accessible|Could not resolve|rate limit' "$f"; then
              echo "::error::$f enthaelt eine Fehlerkarte"
              git checkout -- "$f"
              failed=1
            fi
          done
          exit $failed

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
